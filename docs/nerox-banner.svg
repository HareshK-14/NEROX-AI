<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="25%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Overlay Gradient -->
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Banner Card -->
  <rect x="10" y="10" width="1180" height="340" rx="28" ry="28" fill="url(#auroraGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="10" y="10" width="1180" height="340" rx="28" ry="28" fill="url(#overlayGrad)" />

  <!-- Decorative Glowing Rings -->
  <circle cx="1060" cy="80" r="160" fill="#06b6d4" fill-opacity="0.15" />
  <circle cx="1060" cy="80" r="90" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="120" cy="270" r="200" fill="#7c3aed" fill-opacity="0.2" />
  <circle cx="120" cy="270" r="110" fill="#ffffff" fill-opacity="0.06" />

  <!-- Accent Tech Grid Lines -->
  <line x1="80" y1="180" x2="260" y2="180" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="940" y1="180" x2="1120" y2="180" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4" />
  <circle cx="260" cy="180" r="3" fill="#38bdf8" />
  <circle cx="940" cy="180" r="3" fill="#38bdf8" />

  <!-- Glass Pill Tag for Top Accent -->
  <rect x="410" y="44" width="380" height="36" rx="18" ry="18" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="434" cy="62" r="4.5" fill="#4ade80" />
  <text x="600" y="68" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">✦ AUTONOMOUS MULTI-AGENT OS ✦</text>

  <!-- Main Title -->
  <text x="600" y="165" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1" text-anchor="middle">NEROX AI</text>

  <!-- Subtitle -->
  <text x="600" y="216" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="500" letter-spacing="0.3" text-anchor="middle" opacity="0.95">Autonomous Campus Intelligence &amp; Placement Operating System</text>

  <!-- Bottom Badges / Chips Row -->
  <rect x="235" y="258" width="160" height="32" rx="16" ry="16" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <text x="315" y="279" fill="#e0f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✦ 20 AI AGENTS</text>

  <rect x="410" y="258" width="170" height="32" rx="16" ry="16" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <text x="495" y="279" fill="#e0f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✦ FULL-STACK REACT+NODE</text>

  <rect x="595" y="258" width="190" height="32" rx="16" ry="16" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <text x="690" y="279" fill="#e0f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✦ GOOGLE GEMINI POWERED</text>

  <rect x="800" y="258" width="165" height="32" rx="16" ry="16" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <text x="882" y="279" fill="#e0f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✦ PLACEMENT READY</text>
</svg>
