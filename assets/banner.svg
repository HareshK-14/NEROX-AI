<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Overlay Gradient for Depth -->
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 68px;
      letter-spacing: -0.5px;
      fill: #ffffff;
      text-anchor: middle;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.5px;
      fill: #f1f5f9;
      text-anchor: middle;
      opacity: 0.95;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #ffffff;
      text-anchor: middle;
    }
  </style>

  <!-- Outer Rounded Banner Card -->
  <rect x="15" y="15" width="1170" height="290" rx="24" ry="24" fill="url(#auroraGrad)" filter="url(#dropShadow)" />
  <rect x="15" y="15" width="1170" height="290" rx="24" ry="24" fill="url(#overlayGrad)" />

  <!-- Decorative Subtle Rings -->
  <circle cx="1080" cy="60" r="140" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="120" cy="240" r="180" fill="#ffffff" fill-opacity="0.05" />

  <!-- Glass Pill Tag for Top Accent -->
  <rect x="420" y="48" width="360" height="34" rx="17" ry="17" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <text x="600" y="70" class="tag-text">✦ MULTI-AGENT AI PLATFORM ✦</text>

  <!-- Main Title -->
  <text x="600" y="162" class="title">NEROX AI</text>

  <!-- Subtitle -->
  <text x="600" y="212" class="subtitle">Autonomous Campus Intelligence &amp; Placement Operating System</text>

  <!-- Bottom Chips / Subtext -->
  <text x="600" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16px" font-weight="500" fill="#e2e8f0" text-anchor="middle" opacity="0.88">
    AI-Assisted • Full-Stack • 20 Dedicated Agents • Placement Ready
  </text>
</svg>